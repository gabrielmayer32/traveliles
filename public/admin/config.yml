backend:
  name: github
  repo: gabrielmayer32/traveliles
  branch: dev
  base_url: https://sveltia-cms-auth.gabriel0mayer.workers.dev

site_url: https://multilang.travel-iles.pages.dev
display_url: https://multilang.travel-iles.pages.dev

autosave: true

show_preview_links: false

media_folder: public/images/uploads
public_folder: /images/uploads

i18n:
  structure: multiple_folders
  locales:
    - fr
    - en
  default_locale: fr
  save_all_locales: false

collections:
  - name: hero
    label: Vidéo à la une
    files:
      - name: hero
        label: Vidéo à la une (FR)
        file: src/content/hero/hero.md
        fields:
          - { name: title, label: Titre, widget: string }
          - { name: label, label: Étiquette, widget: string, required: false, hint: "Texte libre affiché au-dessus du titre (ex: Nos adresses, Nouveau, Exclusif…)" }
          - { name: excerpt, label: Extrait, widget: text, required: false }
          - { name: videoFile, label: URL vidéo R2, widget: string, hint: "URL publique du fichier MP4 sur Cloudflare R2" }
          - { name: poster, label: Image de démarrage, widget: image, required: false, hint: "Image affichée avant que la vidéo ne démarre (évite l'écran gris)" }
          - { name: published, label: Publié, widget: boolean, default: true }
      - name: hero-en
        label: Featured video (EN)
        file: src/content/hero/hero-en.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: label, label: Label, widget: string, required: false, hint: "Free text displayed above the title (e.g. Our picks, New, Exclusive…)" }
          - { name: excerpt, label: Excerpt, widget: text, required: false }
          - { name: videoFile, label: R2 video URL, widget: string, hint: "Public URL of the MP4 file on Cloudflare R2" }
          - { name: poster, label: Poster image, widget: image, required: false, hint: "Image displayed before the video starts" }
          - { name: published, label: Published, widget: boolean, default: true }

  - name: articles
    label: Articles
    folder: src/content/articles
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    i18n: true
    preview_path: "articles/{{slug}}"
    sortable_fields:
      - title
      - date
      - category
      - author
    view_groups:
      - label: Catégorie
        field: category
      - label: Auteur
        field: author
      - label: Publié
        field: published
    fields:
      - { name: title, label: Titre / Title, widget: string, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, i18n: duplicate }
      - label: Catégorie
        name: category
        widget: select
        i18n: duplicate
        options:
          - Rencontres
          - Nos régions
          - Savoir-faire
          - Maurice demain
          - Saveurs
          - Art & Culture
          - Activités & Événements
          - Nos adresses
          - Escapades
          - Nos archives
      - { name: cover, label: Image principale, widget: image, required: false, i18n: duplicate }
      - { name: excerpt, label: Extrait / Excerpt, widget: text, required: false, i18n: true }
      - { name: author, label: Auteur, widget: string, default: "Travel-Îles", i18n: duplicate }
      - { name: tags, label: Tags, widget: list, required: false, i18n: true }
      - { name: published, label: Publié, widget: boolean, default: false, i18n: true }
      - { name: body, label: Corps / Body, widget: markdown, required: false, i18n: true }

  - name: videos
    label: Vidéos
    folder: src/content/videos
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    i18n: true
    preview_path: "videos/{{slug}}"
    sortable_fields:
      - title
      - date
      - category
    view_groups:
      - label: Catégorie
        field: category
      - label: Source
        field: videoSource
      - label: Publié
        field: published
    fields:
      - { name: title, label: Titre / Title, widget: string, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, i18n: duplicate }
      - label: Catégorie
        name: category
        widget: select
        i18n: duplicate
        options:
          - Rencontres
          - Nos régions
          - Savoir-faire
          - Maurice demain
          - Saveurs
          - Art & Culture
          - Activités & Événements
          - Nos adresses
          - Escapades
          - Nos archives
      - label: Source vidéo
        name: videoSource
        widget: select
        i18n: duplicate
        options:
          - { label: YouTube, value: youtube }
          - { label: Vimeo, value: vimeo }
          - { label: Facebook, value: facebook }
          - { label: Instagram, value: instagram }
          - { label: Cloudflare R2, value: r2 }
      - { name: videoId, label: ID vidéo / Video ID, widget: string, required: false, i18n: duplicate, hint: "YouTube: ID ou URL complète de la vidéo. Vimeo: ID numérique. Facebook: URL complète de la vidéo. Instagram: shortcode du reel ou post. Laisser vide pour R2." }
      - { name: videoFile, label: URL vidéo R2 / R2 video URL, widget: string, required: false, i18n: duplicate, hint: "URL publique du fichier vidéo sur Cloudflare R2. Utiliser uniquement si Source = Cloudflare R2." }
      - { name: thumbnail, label: Vignette / Thumbnail, widget: image, required: false, i18n: duplicate }
      - { name: excerpt, label: Extrait / Excerpt, widget: text, required: false, i18n: true }
      - { name: published, label: Publié / Published, widget: boolean, default: false, i18n: true }
      - { name: body, label: Description, widget: markdown, required: false, i18n: true }

  - name: partners
    label: Partenaires
    files:
      - name: partners
        label: Partenaires (FR)
        file: src/content/partners/partners.md
        fields:
          - name: partners
            label: Partenaires
            widget: list
            fields:
              - { name: name, label: Nom, widget: string }
              - { name: logo, label: Logo, widget: image }
              - { name: url, label: Lien, widget: string, required: false }
      - name: partners-en
        label: Partners (EN)
        file: src/content/partners/partners-en.md
        fields:
          - name: partners
            label: Partners
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: logo, label: Logo, widget: image }
              - { name: url, label: Link, widget: string, required: false }

  - name: pages
    label: Pages
    files:
      - name: a-propos
        label: À propos (FR)
        file: src/content/pages/fr/a-propos.md
        fields:
          - { name: title, label: Titre, widget: string, required: false }
          - { name: body, label: Contenu, widget: markdown, required: false }
      - name: a-propos-en
        label: About (EN)
        file: src/content/pages/en/a-propos.md
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - { name: body, label: Content, widget: markdown, required: false }
      - name: contact
        label: Contact (FR)
        file: src/content/pages/fr/contact.md
        fields:
          - { name: title, label: Titre, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - { name: body, label: Contenu, widget: markdown, required: false }
      - name: contact-en
        label: Contact (EN)
        file: src/content/pages/en/contact.md
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - { name: body, label: Content, widget: markdown, required: false }
      - name: mentions-legales
        label: Mentions légales (FR)
        file: src/content/pages/fr/mentions-legales.md
        fields:
          - { name: title, label: Titre, widget: string, required: false }
          - { name: body, label: Contenu, widget: markdown, required: false }
      - name: mentions-legales-en
        label: Legal notice (EN)
        file: src/content/pages/en/mentions-legales.md
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - { name: body, label: Content, widget: markdown, required: false }
      - name: confidentialite
        label: Confidentialité (FR)
        file: src/content/pages/fr/confidentialite.md
        fields:
          - { name: title, label: Titre, widget: string, required: false }
          - { name: body, label: Contenu, widget: markdown, required: false }
      - name: confidentialite-en
        label: Privacy policy (EN)
        file: src/content/pages/en/confidentialite.md
        fields:
          - { name: title, label: Title, widget: string, required: false }
          - { name: body, label: Content, widget: markdown, required: false }
